[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-cloud-ai-platform"
version = "0.1.0"
description = "Provider-neutral control plane for GPU AI workloads"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
ai-platform = "ai_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_platform"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
