services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0"]
    environment: ["API_BASE_URL=http://api:8000"]
    ports: ["8501:8501"]
    depends_on: [api]
    profiles: [ui]
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    profiles: [ollama]
volumes: {ollama: {}}

