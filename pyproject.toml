[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-search-agent"
version = "0.1.0"
description = "Evidence-grounded sustainability report research agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1", "PyYAML>=6,<7", "langgraph>=0.2,<2", "ddgs>=9,<10",
  "llama-index-core>=0.12,<0.15", "llama-index-embeddings-huggingface>=0.5,<0.7",
  "llama-index-embeddings-fastembed>=0.3,<1",
  # Docling 2.123 pulls docling-parse 7.x, which has no Intel macOS wheel and
  # currently fails to build with the supported local Apple toolchain.
  "docling>=2.10,<2.11", "pypdf>=5,<7", "openai>=1.55,<3",
  "numpy>=1.24,<2", "scipy>=1.6,<1.14", "opencv-python-headless>=4.9,<4.10",
  "sentence-transformers>=2.7,<4", "transformers>=4.40,<4.46",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
mcp = ["fastmcp>=2,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["search_agent"]
ignore_missing_imports = true
disable_error_code = ["call-arg", "import-untyped"]

[tool.uv]
# Keep one lock file installable on the Intel development Mac and the Linux
# x86_64 production container. Resolution fails early if either loses wheels.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
