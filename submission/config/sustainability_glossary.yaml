schema_version: 1
glossary_version: 1.0.0
concepts:
  - id: scope_1_emissions
    canonical_name: Scope 1 emissions
    definition: Direct greenhouse-gas emissions from sources owned or controlled by the reporting organization.
    aliases: [Scope 1, direct emissions]
    abbreviations: [S1]
    related_concepts: [organizational_boundary, greenhouse_gas_protocol]
    non_equivalent_terms: [Scope 2 emissions, Scope 3 emissions]
    expected_units: [kt_co2e, t_co2e]
    qualifiers: [organizational_boundary, fiscal_year, methodology]
    query_expansion: [Sustainability Key Performance Indicators, total Scope 1 emissions]
    value_patterns: ['(?:total\s+)?scope\s*1\b(?!\s*\+).{0,160}\d']
    provenance: &migration
      source_document: legacy production vocabulary migration
      company: null
      report_year: null
      pdf_page: null
      printed_page: null
      supporting_text: Migrated from the reviewed retrieval and unit-normalization rules.
      extracted_at: '2026-08-31T00:00:00Z'
      confidence: 1.0
      approval_status: approved
      approved_by: repository migration
  - id: scope_2_emissions
    canonical_name: Scope 2 emissions
    definition: Indirect greenhouse-gas emissions associated with purchased or acquired energy.
    aliases: [Scope 2, indirect energy emissions]
    abbreviations: [S2]
    related_concepts: [scope_2_market_based, scope_2_location_based, greenhouse_gas_protocol]
    non_equivalent_terms: [Scope 1 emissions, Scope 3 emissions]
    expected_units: [kt_co2e, t_co2e]
    qualifiers: [organizational_boundary, fiscal_year, methodology, scope_2_basis]
    query_expansion: [Sustainability Key Performance Indicators, Scope 2 market based location based emissions]
    value_patterns: ['scope\s*2\b.{0,500}(?:market[ -]based|location[ -]based).{0,160}\d']
    provenance: *migration
  - id: scope_2_market_based
    canonical_name: Scope 2 market-based emissions
    definition: Scope 2 emissions reflecting contractual instruments and supplier-specific emission factors where applicable.
    aliases: [market-based Scope 2, Scope 2 market based]
    abbreviations: []
    related_concepts: [scope_2_emissions]
    non_equivalent_terms: [Scope 2 location-based emissions]
    expected_units: [kt_co2e, t_co2e]
    qualifiers: [fiscal_year, methodology, scope_2_basis]
    query_expansion: [market-based]
    value_patterns: ['market[ -]based.{0,160}\d']
    provenance: *migration
  - id: scope_2_location_based
    canonical_name: Scope 2 location-based emissions
    definition: Scope 2 emissions calculated using average grid emission factors for the locations where energy is consumed.
    aliases: [location-based Scope 2, Scope 2 location based]
    abbreviations: []
    related_concepts: [scope_2_emissions]
    non_equivalent_terms: [Scope 2 market-based emissions]
    expected_units: [kt_co2e, t_co2e]
    qualifiers: [fiscal_year, methodology, scope_2_basis]
    query_expansion: [location-based]
    value_patterns: ['location[ -]based.{0,160}\d']
    provenance: *migration
  - id: scope_3_emissions
    canonical_name: Scope 3 emissions
    definition: Other indirect greenhouse-gas emissions across the reporting organization's value chain.
    aliases: [Scope 3, value chain emissions]
    abbreviations: [S3]
    related_concepts: [greenhouse_gas_protocol, organizational_boundary]
    non_equivalent_terms: [Scope 1 emissions, Scope 2 emissions]
    expected_units: [kt_co2e, t_co2e]
    qualifiers: [organizational_boundary, fiscal_year, methodology]
    query_expansion: [Sustainability Key Performance Indicators, total Scope 3 greenhouse gas emissions]
    value_patterns: ['total\s+scope\s*3\b.{0,160}\d']
    provenance: *migration
  - id: energy_consumption
    canonical_name: Energy consumption
    definition: Energy consumed within the stated reporting boundary and period.
    aliases: [total energy consumption, energy use]
    abbreviations: []
    related_concepts: [renewable_electricity, organizational_boundary]
    non_equivalent_terms: [electricity consumption]
    expected_units: [gj, thousand_gj, gwh, mwh]
    qualifiers: [organizational_boundary, fiscal_year, methodology]
    query_expansion: [Sustainability Key Performance Indicators, total energy consumption, gigajoule, GWh]
    value_patterns: ['(?:total\s+energy\s+consumption|energy\s+consumption.{0,80}total).{0,160}\d']
    provenance: *migration
  - id: renewable_electricity
    canonical_name: Renewable electricity
    definition: Electricity from renewable sources within the stated reporting scope.
    aliases: [renewable electricity consumption, electricity from renewable sources]
    abbreviations: []
    related_concepts: [energy_consumption]
    non_equivalent_terms: [renewable energy]
    expected_units: [percent, gwh, mwh]
    qualifiers: [organizational_boundary, fiscal_year, methodology]
    query_expansion: [Sustainability Key Performance Indicators, renewable electricity consumption, percentage]
    value_patterns: ['renewable\s+electricity.{0,200}\d']
    provenance: *migration
  - id: water_consumption
    canonical_name: Water consumption
    definition: Water withdrawn and not returned to the same catchment during the reporting period, as defined by the report.
    aliases: [water consumed]
    abbreviations: []
    related_concepts: [organizational_boundary]
    non_equivalent_terms: [water withdrawal, water discharge]
    expected_units: [m3, million_m3]
    qualifiers: [organizational_boundary, fiscal_year, methodology]
    query_expansion: [Sustainability Key Performance Indicators, water consumption, cubic meter]
    value_patterns: ['water\s+consumption.{0,160}\d']
    provenance: *migration
  - id: waste
    canonical_name: Waste generated
    definition: Waste generated within the stated reporting boundary and period.
    aliases: [total waste, total amount of waste, waste generation]
    abbreviations: []
    related_concepts: [organizational_boundary]
    non_equivalent_terms: [waste recycled, waste disposed]
    expected_units: [metric_tons, thousand_tons]
    qualifiers: [organizational_boundary, fiscal_year, methodology]
    query_expansion: [Sustainability Key Performance Indicators, waste total generated, metric tons, construction waste]
    value_patterns: ['(?:total\s+(?:amount\s+of\s+)?waste|waste.{0,80}total).{0,160}\d']
    provenance: *migration
  - id: organizational_boundary
    canonical_name: Organizational boundary
