units:
  - {id: kt_co2e, canonical: 'kt CO2e', aliases: ['kt CO2e', '1,000 metric tons of CO2e'], pattern: '\b(?:kt\s*CO[₂2]e|1,000\s+metric\s+tons?\s+of\s+CO[₂2]e)', broader_unit: t_co2e, provenance: *migration}
  - {id: t_co2e, canonical: tCO2e, aliases: [tCO2e, 'metric tons of CO2e'], pattern: '\b(?:tCO[₂2]e|metric\s+tons?\s+of\s+CO[₂2]e)', broader_unit: metric_tons, provenance: *migration}
  - {id: thousand_gj, canonical: 'thousand GJ', aliases: ['1,000 gigajoules', 'thousand gigajoules'], pattern: '\b(?:1,000\s+gigajoules?|thousand\s+gigajoules?)\b', broader_unit: gj, provenance: *migration}
  - {id: million_m3, canonical: 'million m3', aliases: ['million cubic meters', 'million m³'], pattern: '\bmillion\s+(?:cubic\s+meters?|m\s*[³3])\b', broader_unit: m3, provenance: *migration}
  - {id: gwh, canonical: GWh, aliases: [GWh], pattern: '\bGWh\b', broader_unit: null, provenance: *migration}
  - {id: mwh, canonical: MWh, aliases: [MWh], pattern: '\bMWh\b', broader_unit: null, provenance: *migration}
  - {id: gj, canonical: GJ, aliases: [GJ, gigajoule, gigajoules], pattern: '\bGJ\b|\bgigajoules?\b', broader_unit: null, provenance: *migration}
  - {id: m3, canonical: m3, aliases: [m3, m³, cubic meter, cubic meters], pattern: '\bm\s*[³3]\b|\bcubic\s+meters?\b', broader_unit: null, provenance: *migration}
  - {id: metric_tons, canonical: 'metric tons', aliases: ['metric ton', 'metric tons', ton, tons, kiloton, kilotons], pattern: '\b(?:metric\s+)?(?:kilo)?tons?\b', broader_unit: null, provenance: *migration}
  - {id: thousand_tons, canonical: 'thousand tons', aliases: ['thousand tons', '1,000 tons'], pattern: '\b(?:thousand|1,000)\s+(?:metric\s+)?tons?\b', broader_unit: metric_tons, suppressed_by: [kt_co2e], provenance: *migration}
  - {id: percent, canonical: '%', aliases: ['%', percent, percentage], pattern: '%|\bpercent(?:age)?\b', broader_unit: null, provenance: *migration}
qualifiers:
  - {id: organizational_boundary, definition: Entities and operations included in the reported value., provenance: *migration}
  - {id: methodology, definition: Standard, calculation, estimation, or assumption applied., provenance: *migration}
  - {id: fiscal_year, definition: Period to which the value applies., provenance: *migration}
  - {id: scope_2_basis, definition: Whether Scope 2 is market-based or location-based., provenance: *migration}
